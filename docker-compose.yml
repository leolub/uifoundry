services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uifoundry}
      POSTGRES_USER: ${POSTGRES_USER:-uifoundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uifoundry_local_only}
    ports:
      - "5432:5432"
    volumes:
      - uifoundry_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/uifoundry}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-uifoundry}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-uifoundry_local_only}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-uifoundry-local-development-secret-change-before-production}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600}
      UIFOUNDRY_STORAGE_DIR: /data/source-images
      UIFOUNDRY_MAX_UPLOAD_SIZE: ${UIFOUNDRY_MAX_UPLOAD_SIZE:-10MB}
      UIFOUNDRY_MAX_UPLOAD_BYTES: ${UIFOUNDRY_MAX_UPLOAD_BYTES:-10485760}
    volumes:
      - uifoundry_source_images:/data/source-images
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  uifoundry_postgres:
  uifoundry_source_images:
