spring:
  datasource:
    url: jdbc:h2:mem:uifoundry;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    org.springframework: WARN

app:
  frontend-origin: http://localhost:5173
  jwt:
    secret: uifoundry-test-jwt-secret-with-at-least-32-bytes
    access-token-expiration-seconds: 3600
  storage:
    source-images-directory: ${java.io.tmpdir}/uifoundry-test-source-images
    max-source-image-size-bytes: 32
  ai:
    gemini-api-key:
    model: gemini-test-model
    timeout-seconds: 5
